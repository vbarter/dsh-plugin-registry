name: Discover dsh plugins

on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan GitHub topic and merge catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover.mjs

      - name: Open review PR if catalog changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git checkout -B discover/sync
          git commit -m "chore: sync discovered dsh plugins"
          git push --force origin discover/sync
          EXISTING=$(gh pr list --base main --head discover/sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR already open: #$EXISTING"
            PR_NUM="$EXISTING"
          else
            PR_URL=$(gh pr create --base main --head discover/sync --title "Review: discovered dsh plugins" --body "$(cat <<'EOFBODY'
          自动发现已更新 `data/plugins.json`。合并此 PR 后，站点目录才会发布。

          Auto-discovery updated `data/plugins.json`. Merge this PR to publish the catalog sync.
          EOFBODY
          )")
            echo "Opened $PR_URL"
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi
          if [ -n "${PR_NUM:-}" ]; then
            gh pr merge "$PR_NUM" --auto --merge || gh pr merge "$PR_NUM" --merge || true
          fi
