name: Review curated Manifest

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Review curated plugin manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover.mjs --review-curated

      - name: Open review PR if catalog changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git checkout -B review/curated-manifest
          git commit -m "chore: review curated plugin manifests"
          git push --force origin review/curated-manifest
          EXISTING=$(gh pr list --base main --head review/curated-manifest --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR already open: #$EXISTING"
          else
            gh pr create --base main --head review/curated-manifest --title "Review: curated catalog Manifest checks" --body "$(cat <<'EOFBODY'
          已复核社区目录条目的 Manifest。合并此 PR 后，站点目录才会更新。

          Curated catalog Manifest checks finished. Merge this PR to publish the catalog update.
          EOFBODY
          )"
          fi
